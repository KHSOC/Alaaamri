name: Apply site v39

on:
  push:
    branches: [main]
    paths:
      - '.deploy/READY'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate v39 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/part-* > /tmp/alaaamri-v39-patch.zip.b64
          base64 --decode /tmp/alaaamri-v39-patch.zip.b64 > /tmp/alaaamri-v39-patch.zip
          echo "13af92d76bafe126777509a8bd6aa2c4e2109b20160e9ce24e3f1fb5d4b855bc  /tmp/alaaamri-v39-patch.zip" | sha256sum --check
          unzip -t /tmp/alaaamri-v39-patch.zip

      - name: Apply v39 patch
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq /tmp/alaaamri-v39-patch.zip -d .
          rm -rf .deploy
          rm -f .github/workflows/apply-v39.yml

      - name: Commit and push v39
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Khalid Site Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy v39: expand Security Lab and WebSec Atlas"
          git push origin HEAD:main
